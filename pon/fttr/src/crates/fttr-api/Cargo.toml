[package]
name = "fttr-api"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[features]
codegen = ["dep:ts-rs"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = { version = "12", optional = true }

[dev-dependencies]
fttr-omci = { path = "../omci" }

[[bin]]
name = "fttr-sdk"
path = "src/bin/fttr-sdk.rs"
required-features = ["codegen"]
